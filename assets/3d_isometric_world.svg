<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-16px); }
      }
      @keyframes float3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      .cube1 { animation: float1 4s ease-in-out infinite; }
      .cube2 { animation: float2 5s ease-in-out infinite 0.5s; }
      .cube3 { animation: float3 4.5s ease-in-out infinite 1s; }
      .glow-pulse { animation: pulseGlow 3s ease-in-out infinite; }
      .text-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #1c1917; }
      .text-sub { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; fill: #57534e; }
      .text-code { font-family: 'Consolas', 'Courier New', monospace; font-weight: 600; }
    </style>
    
    <!-- Warm Cream Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EEE2" />
      <stop offset="100%" stop-color="#EBE0CD" />
    </linearGradient>

    <!-- Deep Forest Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162e24" />
      <stop offset="100%" stop-color="#0e1f18" />
    </linearGradient>

    <!-- Emerald Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for 3D Cards -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7a4825" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" stroke="#D5C2A5" stroke-width="2" />

  <!-- 3D Isometric Grid Background -->
  <g opacity="0.18" stroke="#7A4825" stroke-width="1">
    <path d="M 0 50 L 1200 400 M 0 100 L 1200 450 M 0 150 L 1200 500 M 0 200 L 1200 550" />
    <path d="M 0 350 L 1200 0 M 0 400 L 1200 50 M 0 450 L 1200 100 M 0 500 L 1200 150" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="210" r="180" fill="#10B981" opacity="0.08" class="glow-pulse" filter="url(#emeraldGlow)" />
  <circle cx="300" cy="350" r="140" fill="#B6743F" opacity="0.06" class="glow-pulse" />

  <!-- LEFT HERO SECTION -->
  <g transform="translate(60, 50)">
    <!-- Category Pill -->
    <rect width="360" height="32" rx="16" fill="#10241D" stroke="#10B981" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#10B981" />
    <text x="30" y="21" class="text-code" font-size="12" fill="#10B981">● 3D ISOMETRIC VIRTUAL ARCHIVE</text>

    <!-- Main Title -->
    <text x="0" y="80" class="text-title" font-size="38">JUBAYER AHMAD</text>
    <text x="0" y="115" class="text-sub" font-size="16">Autonomous Systems Architect • 3D WebGL Worlds • Full-Stack Cloud</text>

    <!-- Interactive Badges Grid -->
    <g transform="translate(0, 140)">
      <!-- Card 1 -->
      <rect width="230" height="70" rx="12" fill="url(#cardGrad)" stroke="#1F4234" stroke-width="1" filter="url(#cardShadow)" />
      <rect width="4" height="70" rx="2" fill="#FFB800" />
      <text x="16" y="28" class="text-code" font-size="13" fill="#F8FAFC">🏎️ Bruno 3D Driving</text>
      <text x="16" y="50" class="text-sub" font-size="11" fill="#94A3B8">Three.js Physics World (60 FPS)</text>

      <!-- Card 2 -->
      <rect x="250" width="230" height="70" rx="12" fill="url(#cardGrad)" stroke="#1F4234" stroke-width="1" filter="url(#cardShadow)" />
      <rect x="250" width="4" height="70" rx="2" fill="#10B981" />
      <text x="266" y="28" class="text-code" font-size="13" fill="#F8FAFC">🏰 NoorHub SaaS Cloud</text>
      <text x="266" y="50" class="text-sub" font-size="11" fill="#94A3B8">Next.js 15 • 29 App Routes</text>

      <!-- Card 3 -->
      <rect y="85" width="230" height="70" rx="12" fill="url(#cardGrad)" stroke="#1F4234" stroke-width="1" filter="url(#cardShadow)" />
      <rect y="85" width="4" height="70" rx="2" fill="#00E5FF" />
      <text x="16" y="113" class="text-code" font-size="13" fill="#F8FAFC">⚔️ Safin Blade Fighter</text>
      <text x="16" y="135" class="text-sub" font-size="11" fill="#94A3B8">60 FPS Martial Arts Duel</text>

      <!-- Card 4 -->
      <rect x="250" y="85" width="230" height="70" rx="12" fill="url(#cardGrad)" stroke="#1F4234" stroke-width="1" filter="url(#cardShadow)" />
      <rect x="250" y="85" width="4" height="70" rx="2" fill="#A855F7" />
      <text x="266" y="113" class="text-code" font-size="13" fill="#F8FAFC">🤖 Desktop Jarvis OS</text>
      <text x="266" y="135" class="text-sub" font-size="11" fill="#94A3B8">Biometric Voiceprint Auth</text>
    </g>

    <!-- Bottom Telemetry Badges -->
    <g transform="translate(0, 315)">
      <rect width="115" height="26" rx="6" fill="#D5C2A5" />
      <text x="12" y="17" class="text-code" font-size="11" fill="#1C1917">HTML5 / WebGL</text>

      <rect x="125" width="105" height="26" rx="6" fill="#D5C2A5" />
      <text x="137" y="17" class="text-code" font-size="11" fill="#1C1917">TypeScript 5</text>

      <rect x="240" width="110" height="26" rx="6" fill="#D5C2A5" />
      <text x="252" y="17" class="text-code" font-size="11" fill="#1C1917">Next.js 15</text>

      <rect x="360" width="120" height="26" rx="6" fill="#10241D" stroke="#10B981" />
      <text x="372" y="17" class="text-code" font-size="11" fill="#10B981">● ONLINE READY</text>
    </g>
  </g>

  <!-- RIGHT 3D ISOMETRIC FLOATING VOXEL WORLD -->
  <g transform="translate(860, 200)">
    <!-- Base Platform Shadow -->
    <ellipse cx="0" cy="130" rx="180" ry="60" fill="#7A4825" opacity="0.18" />

    <!-- Isometric Floating Island (Main Green/Dark Prism) -->
    <!-- Top Face of Floating Island -->
    <path d="M 0 -20 L 160 60 L 0 140 L -160 60 Z" fill="#162E24" stroke="#10B981" stroke-width="1.5" />
    <!-- Left Face -->
    <path d="M -160 60 L 0 140 L 0 190 L -160 110 Z" fill="#0C1B15" />
    <!-- Right Face -->
    <path d="M 0 140 L 160 60 L 160 110 L 0 190 Z" fill="#08140F" />

    <!-- 3D Floating Animated Cube 1 (Gold/Amber) -->
    <g class="cube1">
      <g transform="translate(-50, -40)">
        <!-- Top -->
        <path d="M 0 -25 L 35 -5 L 0 15 L -35 -5 Z" fill="#D97706" />
        <!-- Left -->
        <path d="M -35 -5 L 0 15 L 0 50 L -35 30 Z" fill="#B45309" />
        <!-- Right -->
        <path d="M 0 15 L 35 -5 L 35 30 L 0 50 Z" fill="#92400E" />
      </g>
    </g>

    <!-- 3D Floating Animated Cube 2 (Emerald) -->
    <g class="cube2">
      <g transform="translate(60, -20)">
        <!-- Top -->
        <path d="M 0 -30 L 40 -8 L 0 16 L -40 -8 Z" fill="#10B981" />
        <!-- Left -->
        <path d="M -40 -8 L 0 16 L 0 56 L -40 32 Z" fill="#059669" />
        <!-- Right -->
        <path d="M 0 16 L 40 -8 L 40 32 L 0 56 Z" fill="#047857" />
      </g>
    </g>

    <!-- 3D Floating Animated Cube 3 (Cyan Tech Prism) -->
    <g class="cube3">
      <g transform="translate(0, -90)">
        <!-- Top -->
        <path d="M 0 -25 L 35 -5 L 0 15 L -35 -5 Z" fill="#00E5FF" />
        <!-- Left -->
        <path d="M -35 -5 L 0 15 L 0 50 L -35 30 Z" fill="#00B4D8" />
        <!-- Right -->
        <path d="M 0 15 L 35 -5 L 35 30 L 0 50 Z" fill="#0077B6" />
      </g>
    </g>

    <!-- Cyberpunk Holo-Rays / Beacons -->
    <line x1="0" y1="60" x2="0" y2="-90" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
    <circle cx="0" cy="-90" r="6" fill="#00E5FF" filter="url(#emeraldGlow)" />
  </g>
</svg>
