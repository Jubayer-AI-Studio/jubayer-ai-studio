<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes waveBar1 { 0%, 100% { height: 16px; } 50% { height: 64px; } }
      @keyframes waveBar2 { 0%, 100% { height: 48px; } 50% { height: 18px; } }
      @keyframes waveBar3 { 0%, 100% { height: 28px; } 50% { height: 80px; } }
      @keyframes waveBar4 { 0%, 100% { height: 72px; } 50% { height: 32px; } }
      @keyframes waveBar5 { 0%, 100% { height: 36px; } 50% { height: 90px; } }
      @keyframes floatCube {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(2deg); }
      }
      @keyframes pulseRing {
        0% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 0.3; }
        100% { transform: scale(0.9); opacity: 0.8; }
      }
      @keyframes scanbeam {
        0% { transform: translateY(0px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(320px); opacity: 0; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .bar1 { animation: waveBar1 1.2s ease-in-out infinite; }
      .bar2 { animation: waveBar2 1.5s ease-in-out infinite; }
      .bar3 { animation: waveBar3 1.1s ease-in-out infinite; }
      .bar4 { animation: waveBar4 1.4s ease-in-out infinite; }
      .bar5 { animation: waveBar5 1.3s ease-in-out infinite; }
      .cube-float { animation: floatCube 4s ease-in-out infinite; }
      .ring-pulse { animation: pulseRing 3s ease-in-out infinite; transform-origin: center; }
      .scanner-line { animation: scanbeam 3.5s ease-in-out infinite; }
      .cursor-blink { animation: blinkCursor 0.9s infinite; }
      .radar-arm { animation: radarSweep 6s linear infinite; transform-origin: 950px 240px; }

      .text-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; fill: #1c1917; }
      .text-sub { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; fill: #57534e; }
      .text-mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    </style>

    <!-- Warm Cream Beige Background Gradient -->
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EEE2" />
      <stop offset="50%" stop-color="#EBE0CD" />
      <stop offset="100%" stop-color="#E5D6C0" />
    </linearGradient>

    <!-- Deep Emerald Forest Card Gradient -->
    <linearGradient id="forestCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c22" />
      <stop offset="100%" stop-color="#0a1a14" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7a4825" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Base 100% Warm Cream Beige Canvas -->
  <rect width="1200" height="480" rx="20" fill="url(#warmBg)" stroke="#D5C2A5" stroke-width="2" />

  <!-- 3D Perspective Isometric Grid Lines in Background -->
  <g opacity="0.14" stroke="#7A4825" stroke-width="1.2">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="150" y1="0" x2="50" y2="480" />
    <line x1="350" y1="0" x2="250" y2="480" />
    <line x1="550" y1="0" x2="450" y2="480" />
    <line x1="750" y1="0" x2="650" y2="480" />
    <line x1="950" y1="0" x2="850" y2="480" />
    <line x1="1150" y1="0" x2="1050" y2="480" />
  </g>

  <!-- LEFT HUD COCKPIT: LIVE ARCHITECT CONSOLE -->
  <g transform="translate(60, 45)">
    <!-- Live Status Pill with Pulsing Indicator -->
    <rect width="360" height="34" rx="17" fill="#10241D" stroke="#10B981" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#10B981" filter="url(#neonGlow)" />
    <circle cx="20" cy="17" r="10" fill="none" stroke="#10B981" stroke-width="1.5" class="ring-pulse" />
    <text x="38" y="22" class="text-mono" font-size="12" fill="#10B981">● LIVE SYSTEM HUD // LEVEL 99 BOSS</text>

    <!-- Main Title -->
    <text x="0" y="85" class="text-title" font-size="44" letter-spacing="-0.5">JUBAYER AHMAD</text>
    <text x="0" y="118" class="text-sub" font-size="17">Autonomous Systems Architect • 3D WebGL Worlds • Full-Stack Cloud</text>

    <!-- Real-Time Interactive Audio Waveform / Frequency Spectrum -->
    <g transform="translate(0, 140)">
      <rect width="520" height="85" rx="14" fill="url(#forestCard)" stroke="#1F4234" stroke-width="1" filter="url(#boxShadow)" />
      
      <!-- Audio Spectrum Frequency Bars (Animated) -->
      <g transform="translate(25, 60)">
        <text x="0" y="-35" class="text-mono" font-size="11" fill="#D97706">⚡ REAL-TIME VOICEPRINT & NEURAL AUDIO HUD:</text>
        
        <!-- Animated Equalizer Bars -->
        <rect x="0" y="-10" width="8" rx="4" fill="#00E5FF" class="bar1" />
        <rect x="14" y="-10" width="8" rx="4" fill="#10B981" class="bar2" />
        <rect x="28" y="-10" width="8" rx="4" fill="#FFB800" class="bar3" />
        <rect x="42" y="-10" width="8" rx="4" fill="#00E5FF" class="bar4" />
        <rect x="56" y="-10" width="8" rx="4" fill="#10B981" class="bar5" />
        <rect x="70" y="-10" width="8" rx="4" fill="#A855F7" class="bar2" />
        <rect x="84" y="-10" width="8" rx="4" fill="#00E5FF" class="bar3" />
        <rect x="98" y="-10" width="8" rx="4" fill="#10B981" class="bar1" />
        <rect x="112" y="-10" width="8" rx="4" fill="#FFB800" class="bar4" />
        <rect x="126" y="-10" width="8" rx="4" fill="#00E5FF" class="bar2" />
        <rect x="140" y="-10" width="8" rx="4" fill="#10B981" class="bar5" />
        <rect x="154" y="-10" width="8" rx="4" fill="#A855F7" class="bar3" />
        <rect x="168" y="-10" width="8" rx="4" fill="#00E5FF" class="bar1" />
        <rect x="182" y="-10" width="8" rx="4" fill="#10B981" class="bar4" />
        <rect x="196" y="-10" width="8" rx="4" fill="#FFB800" class="bar2" />
      </g>

      <!-- HUD Telemetry Numbers -->
      <g transform="translate(270, 22)">
        <text x="0" y="16" class="text-mono" font-size="11" fill="#94A3B8">ENGINE LATENCY:</text>
        <text x="130" y="16" class="text-mono" font-size="12" fill="#10B981">0.14 ms (OPTIMAL)</text>

        <text x="0" y="36" class="text-mono" font-size="11" fill="#94A3B8">3D WEBGL FRAMES:</text>
        <text x="130" y="36" class="text-mono" font-size="12" fill="#00E5FF">60.0 FPS (LOCKED)</text>

        <text x="0" y="56" class="text-mono" font-size="11" fill="#94A3B8">JARVIS VOICE AUTH:</text>
        <text x="130" y="56" class="text-mono" font-size="12" fill="#FFB800">BIOMETRIC 100%</text>
      </g>
    </g>

    <!-- LIVE TERMINAL CONSOLE BOX -->
    <g transform="translate(0, 245)">
      <rect width="520" height="95" rx="14" fill="#0A1612" stroke="#10B981" stroke-width="1" filter="url(#boxShadow)" />
      
      <!-- Terminal Header Dots -->
      <circle cx="20" cy="18" r="5" fill="#EF4444" />
      <circle cx="36" cy="18" r="5" fill="#F59E0B" />
      <circle cx="52" cy="18" r="5" fill="#10B981" />
      <text x="75" y="22" class="text-mono" font-size="11" fill="#64748B">kernel@jubayer-ai-studio:~$ status</text>

      <!-- Terminal Lines -->
      <text x="20" y="48" class="text-mono" font-size="12" fill="#38BDF8">> [LOADED] Bruno Simon 3D Car Engine (RigidBody WebGL)</text>
      <text x="20" y="68" class="text-mono" font-size="12" fill="#4ADE80">> [ACTIVE] NoorHub Multi-Tenant Cloud SaaS (29 Completed Routes)</text>
      <text x="20" y="86" class="text-mono" font-size="12" fill="#FACC15">> [READY]  Awaiting User Input... <tspan class="cursor-blink" fill="#00E5FF">█</tspan></text>
    </g>

    <!-- Action Launch Pills -->
    <g transform="translate(0, 360)">
      <rect width="180" height="34" rx="8" fill="#B6743F" />
      <text x="20" y="22" class="text-mono" font-size="12" fill="#FFFFFF">🏎️ PLAY BRUNO 3D</text>

      <rect x="195" width="165" height="34" rx="8" fill="#10241D" stroke="#10B981" />
      <text x="210" y="22" class="text-mono" font-size="12" fill="#10B981">⚔️ PLAY FIGHTER</text>

      <rect x="375" width="145" height="34" rx="8" fill="#10241D" stroke="#00E5FF" />
      <text x="390" y="22" class="text-mono" font-size="12" fill="#00E5FF">🏰 NOORHUB CLOUD</text>
    </g>
  </g>

  <!-- RIGHT SIDE: 3D HOLOGRAPHIC ROTATING CYBER WORLD -->
  <g transform="translate(940, 240)">
    <!-- Ambient 3D Depth Rings -->
    <ellipse cx="0" cy="130" rx="190" ry="70" fill="#7A4825" opacity="0.2" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4" class="ring-pulse" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.5" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="2,4" opacity="0.6" />

    <!-- 3D Radar Scanner Arm (Rotating 360 deg) -->
    <line x1="0" y1="0" x2="160" y2="0" stroke="#10B981" stroke-width="2" class="radar-arm" filter="url(#neonGlow)" />

    <!-- Floating 3D Isometric Island Platform -->
    <g class="cube-float">
      <!-- Top Face of Cyber Island -->
      <path d="M 0 -35 L 140 40 L 0 115 L -140 40 Z" fill="#142C22" stroke="#10B981" stroke-width="2" />
      <!-- Left Face -->
      <path d="M -140 40 L 0 115 L 0 165 L -140 90 Z" fill="#0A1813" />
      <!-- Right Face -->
      <path d="M 0 115 L 140 40 L 140 90 L 0 165 Z" fill="#06100C" />

      <!-- 3D Holographic Wireframe Voxel Cubes Sitting on Top -->
      <!-- Cube 1 (Amber Gold) -->
      <g transform="translate(-45, 10)">
        <path d="M 0 -22 L 28 -6 L 0 10 L -28 -6 Z" fill="#D97706" />
        <path d="M -28 -6 L 0 10 L 0 38 L -28 22 Z" fill="#B45309" />
        <path d="M 0 10 L 28 -6 L 28 22 L 0 38 Z" fill="#92400E" />
      </g>

      <!-- Cube 2 (Cyber Emerald) -->
      <g transform="translate(45, 20)">
        <path d="M 0 -25 L 32 -7 L 0 11 L -32 -7 Z" fill="#10B981" />
        <path d="M -32 -7 L 0 11 L 0 42 L -32 24 Z" fill="#059669" />
        <path d="M 0 11 L 32 -7 L 32 24 L 0 42 Z" fill="#047857" />
      </g>

      <!-- Cube 3 (Cyan Core Apex) -->
      <g transform="translate(0, -45)">
        <path d="M 0 -24 L 30 -7 L 0 10 L -30 -7 Z" fill="#00E5FF" filter="url(#neonGlow)" />
        <path d="M -30 -7 L 0 10 L 0 40 L -30 23 Z" fill="#0284C7" />
        <path d="M 0 10 L 30 -7 L 30 23 L 0 40 Z" fill="#0369A1" />
      </g>

      <!-- Laser Holo-Beam from Apex -->
      <line x1="0" y1="-45" x2="0" y2="-120" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4,4" filter="url(#neonGlow)" />
      <circle cx="0" cy="-120" r="7" fill="#00E5FF" filter="url(#neonGlow)" />
    </g>

    <!-- Holographic Coordinate HUD -->
    <text x="-90" y="160" class="text-mono" font-size="11" fill="#7A4825">SEC_COORDS: [23.8103° N, 90.4125° E]</text>
  </g>
</svg>
